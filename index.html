[202,"Pasta al ragù","Primo",18,"45 min",["Pasta:20","Manzo macinato magro:20","Passata di pomodoro:30","Carote:5","Cipolla:4","Sedano:3","Olio EVO:3"],["Soffriggi con l'olio cipolla, carota e sedano tritati finemente.","Aggiungi il macinato, sgranalo e fallo rosolare.","Versa la passata e cuoci a fuoco dolce 30 minuti.","Condisci la pasta cotta con il ragù."]],
[203,"Lasagne alla bolognese","Piatto unico",24,"1 h 15 min",["Lasagne:15","Manzo macinato magro:15","Passata di pomodoro:25","Latte intero:25","Burro:2","Farina 00:3","Parmigiano:4"],["Prepara il ragù con macinato e passata (30 minuti).","Prepara la besciamella: sciogli il burro, aggiungi la farina e poi il latte caldo, mescolando.","Alterna negli strati sfoglie, ragù, besciamella e parmigiano.","Cuoci in forno a 180 °C per 30 minuti."]],
[204,"Pasta cacio e pepe","Primo",36,"15 min",["Pasta:20","Pecorino romano:8"],["Cuoci la pasta in poca acqua, tenendo da parte un mestolo di acqua di cottura.","Crea una crema mescolando il pecorino con acqua di cottura tiepida.","Manteca la pasta con la crema fuori dal fuoco; pepe a piacere, poco."]],
[205,"Pasta all'amatriciana","Primo",36,"25 min",["Pasta:20","Guanciale:5","Passata di pomodoro:35","Pecorino romano:4"],["Rosola il guanciale a listarelle in padella.","Aggiungi la passata e cuoci 10–12 minuti.","Condisci la pasta e finisci con il pecorino."]],
[206,"Pasta alla norma","Primo",18,"30 min",["Pasta:20","Melanzane:40","Passata di pomodoro:30","Ricotta salata:4","Olio EVO:4","Basilico:1"],["Taglia le melanzane a cubetti e rosolale con l'olio finché sono tenere.","Aggiungi la passata e cuoci 10 minuti.","Condisci la pasta e completa con ricotta salata grattugiata e basilico."]],
[207,"Spaghetti aglio e olio","Primo",24,"15 min",["Pasta:20","Olio EVO:4","Aglio:1","Prezzemolo:1"],["Scalda l'olio con lo spicchio d'aglio intero, poi toglilo.","Scola la pasta al dente e saltala nell'olio con un po' di acqua di cottura.","Finisci con prezzemolo tritato."]],
[208,"Pasta al tonno","Primo",24,"20 min",["Pasta:20","Tonno in scatola:12","Passata di pomodoro:30","Olio EVO:3"],["Scalda l'olio con la passata per 8 minuti.","Aggiungi il tonno sgocciolato e scaldalo per 2 minuti.","Condisci la pasta cotta."]],
[209,"Pasta e fagioli","Piatto unico",18,"40 min",["Pasta corta:12","Fagioli cotti:40","Passata di pomodoro:15","Carote:5","Sedano:3","Cipolla:4","Olio EVO:3"],["Soffriggi cipolla, carota e sedano tritati con l'olio.","Aggiungi i fagioli, la passata e acqua; cuoci 20 minuti, schiacciandone una parte.","Cuoci la pasta direttamente nella zuppa."]],
[210,"Pasta e ceci","Piatto unico",18,"40 min",["Pasta corta:12","Ceci cotti:40","Passata di pomodoro:10","Aglio:1","Olio EVO:3"],["Scalda l'olio con l'aglio, aggiungi ceci e passata.","Cuoci 15 minuti con un po' d'acqua, schiacciando una parte dei ceci.","Aggiungi la pasta e cuocila nella zuppa."]],
[211,"Risotto alla milanese","Primo",18,"30 min",["Riso:20","Burro:3","Parmigiano:5","Cipolla:4"],["Soffriggi la cipolla tritata nel burro e tosta il riso.","Aggiungi brodo caldo poco alla volta, mescolando, per circa 16 minuti (puoi sciogliere un pizzico di zafferano).","Manteca con burro e parmigiano."]],
[212,"Risotto ai funghi","Primo",18,"30 min",["Riso:20","Funghi:40","Burro:2","Parmigiano:5","Cipolla:4"],["Cuoci i funghi a fettine in padella con un filo di olio.","Tosta il riso con la cipolla, poi cuocilo aggiungendo brodo caldo.","A metà cottura unisci i funghi; manteca con burro e parmigiano."]],
[213,"Riso e piselli","Primo",12,"25 min",["Riso:20","Piselli:40","Parmigiano:4","Cipolla:4","Olio EVO:3"],["Soffriggi la cipolla con l'olio, aggiungi i piselli.","Unisci il riso e cuocilo con brodo o acqua calda, in modo brodoso.","Finisci con il parmigiano."]],
[214,"Gnocchi al pomodoro","Primo",18,"20 min",["Gnocchi di patate:70","Passata di pomodoro:40","Olio EVO:3","Parmigiano:4","Basilico:1"],["Prepara il sugo con olio, passata e basilico per 10 minuti.","Cuoci gli gnocchi: sono pronti quando vengono a galla.","Condisci e aggiungi il parmigiano."]],
[215,"Pizza margherita","Piatto unico",24,"2 h",["Farina 00:30","Passata di pomodoro:25","Mozzarella:25","Olio EVO:2"],["Impasta farina, acqua, poco lievito e un pizzico di sale; fai lievitare 1–2 ore (o usa un impasto già pronto).","Stendi, condisci con la passata e un filo di olio.","Cuoci a 220 °C per 10 minuti, aggiungi la mozzarella e cuoci altri 5 minuti."]],
[216,"Polpette al sugo","Secondo",18,"40 min",["Manzo macinato magro:35","Uovo:8","Pangrattato:5","Parmigiano:4","Passata di pomodoro:30","Olio EVO:2"],["Impasta macinato, uovo, pangrattato e parmigiano; forma le polpette.","Rosolale in padella con l'olio.","Aggiungi la passata e cuoci coperte 20 minuti."]],
[217,"Cotoletta di pollo impanata","Secondo",24,"20 min",["Petto di pollo:40","Uovo:8","Pangrattato:8","Olio EVO:5"],["Appiattisci le fettine di pollo.","Passale nell'uovo sbattuto e nel pangrattato.","Cuocile in padella con l'olio o al forno a 200 °C finché sono dorate."]],
[218,"Pollo al limone","Secondo",24,"20 min",["Petto di pollo:40","Olio EVO:3","Burro:2"],["Scalda olio e burro e rosola le fettine di pollo infarinate leggermente.","Aggiungi succo di limone e un mestolino d'acqua.","Cuoci 5 minuti finché la salsa si addensa."]],
[219,"Frittata di zucchine","Secondo",18,"20 min",["Uovo:40","Zucchine:40","Parmigiano:4","Olio EVO:3"],["Salta le zucchine a rondelle con l'olio finché sono morbide.","Sbatti le uova con il parmigiano e versale sulle zucchine.","Cuoci a fuoco basso, girando la frittata a metà."]],
[220,"Parmigiana di melanzane","Secondo",24,"1 h",["Melanzane:70","Passata di pomodoro:40","Mozzarella:25","Parmigiano:5","Olio EVO:5"],["Affetta le melanzane e grigliale o cuocile al forno con l'olio.","Alterna in teglia strati di melanzane, passata, mozzarella e parmigiano.","Cuoci in forno a 180 °C per 30 minuti."]],
[221,"Merluzzo al forno con patate","Secondo",12,"40 min",["Merluzzo:50","Patate:60","Pomodorini:20","Olio EVO:4","Prezzemolo:1"],["Taglia le patate sottili e cuocile in forno a 200 °C per 15 minuti con metà olio.","Aggiungi il merluzzo e i pomodorini; condisci con il resto dell'olio.","Cuoci altri 15 minuti e finisci con prezzemolo."]],
[222,"Minestrone","Primo",12,"45 min",["Patate:30","Carote:20","Zucchine:25","Fagiolini:20","Piselli:15","Pasta corta:8","Olio EVO:3","Parmigiano:3"],["Taglia le verdure a cubetti e coprile d'acqua.","Cuoci 30 minuti a fuoco dolce.","Aggiungi la pasta e cuocila nella zuppa; finisci con olio e parmigiano."]],
[223,"Pasta e patate","Primo",18,"35 min",["Pasta corta:12","Patate:60","Cipolla:4","Carote:5","Parmigiano:4","Olio EVO:3"],["Soffriggi cipolla e carota con l'olio, aggiungi le patate a cubetti e acqua.","Cuoci 15 minuti, poi aggiungi la pasta.","Cuoci in modo cremoso e finisci con il parmigiano."]],
[224,"Crespelle ricotta e spinaci","Piatto unico",24,"45 min",["Farina 00:12","Latte intero:40","Uovo:12","Ricotta:25","Spinaci:40","Parmigiano:4"],["Prepara la pastella con farina, latte e uovo e cuoci le crespelle in padella.","Mescola ricotta e spinaci lessati e tritati.","Farcisci, arrotola, cospargi di parmigiano e gratina 10 minuti in forno."]],
[225,"Spaghetti alle vongole","Primo",36,"25 min",["Pasta:20","Vongole:50","Olio EVO:4","Aglio:1","Prezzemolo:1"],["Fai aprire le vongole in padella con olio e aglio, coperte.","Cuoci la pasta a metà cottura e finiscila nella padella con le vongole.","Finisci con prezzemolo. Togli i gusci rotti prima di servire ai più piccoli."]],
[226,"Pasta al pesto","Primo",24,"15 min",["Pasta:20","Basilico:8","Parmigiano:4","Olio EVO:5"],["Frulla basilico, parmigiano e olio (senza pinoli, se ci sono allergie).","Cuoci la pasta e condiscila fuori dal fuoco con il pesto e un po' di acqua di cottura."]],
[227,"Pasta in bianco","Primo",12,"15 min",["Pasta:20","Olio EVO:4","Parmigiano:5"],["Cuoci la pasta e scolala.","Condisci con olio a crudo e parmigiano."]],
[228,"Pasta con i broccoli","Primo",18,"25 min",["Pasta:20","Broccoli:50","Olio EVO:4","Parmigiano:4"],["Lessa i broccoli a cimette e cuocili in padella con l'olio, schiacciandone una parte.","Cuoci la pasta nella stessa acqua dei broccoli.","Salta insieme e finisci con il parmigiano."]],
[229,"Hamburger con patate","Secondo",24,"30 min",["Manzo macinato magro:40","Patate:60","Pane:15","Olio EVO:3"],["Forma gli hamburger con il macinato e cuocili in padella antiaderente.","Cuoci le patate a bastoncini in forno a 200 °C con l'olio.","Servi con il pane."]],
[230,"Salsicce e patate","Secondo",36,"35 min",["Salsiccia:25","Patate:60","Olio EVO:3"],["Taglia le patate a cubetti e cuocile in padella o forno con l'olio.","Aggiungi le salsicce e cuoci 20 minuti, girandole."]],
[231,"Insalata di riso","Piatto unico",24,"30 min",["Riso:20","Tonno in scatola:10","Mais:10","Pomodorini:20","Mozzarella:10","Olio EVO:4"],["Cuoci il riso, scolalo e raffreddalo.","Unisci tonno sgocciolato, mais, pomodorini e mozzarella a dadini.","Condisci con l'olio."]],
[232,"Pasta al forno","Primo",24,"50 min",["Pasta:20","Passata di pomodoro:35","Mozzarella:15","Prosciutto cotto:8","Parmigiano:4"],["Cuoci la pasta molto al dente e condiscila con la passata cotta.","Alterna in teglia pasta, mozzarella, prosciutto a dadini e parmigiano.","Cuoci in forno a 200 °C per 20 minuti."]],
[233,"Pollo e patate al forno","Secondo",18,"50 min",["Petto di pollo:35","Patate:60","Olio EVO:4"],["Taglia pollo e patate a pezzi e condiscili con l'olio.","Cuoci in forno a 200 °C per 35–40 minuti, mescolando a metà."]],
[234,"Zuppa di lenticchie","Piatto unico",18,"45 min",["Lenticchie secche:18","Carote:8","Cipolla:4","Sedano:3","Passata di pomodoro:10","Olio EVO:3"],["Soffriggi cipolla, carota e sedano tritati con l'olio.","Aggiungi lenticchie, passata e acqua e cuoci 30 minuti.","Frulla in parte per una zuppa più cremosa."]],
[235,"Toast prosciutto e formaggio","Piatto unico",24,"10 min",["Pane:25","Prosciutto cotto:12","Mozzarella:15"],["Farcisci il pane con prosciutto e mozzarella.","Scalda in padella o piastra finché il formaggio fonde."]],
[236,"Pappa con brodo vegetale e crema di riso","Pappa",[6,24],"45 min",["Crema di riso:20","Carote:30","Zucchine:30","Patate:30","Olio EVO:5","Parmigiano:3"],["Cuoci carote, zucchine e patate a pezzi in circa 250 ml di acqua, senza sale, per 30-40 minuti.","Filtra il brodo e stempera la crema di riso in quello caldo, mescolando per 3-4 minuti.","Frulla o schiaccia le verdure secondo l'età e uniscile alla pappa.","Aggiungi a crudo l'olio e il parmigiano."]],
[237,"Semolino con zucca e ricotta","Pappa",[6,24],"30 min",["Semolino:20","Zucca:40","Ricotta:25","Olio EVO:5"],["Cuoci la zucca a cubetti in acqua senza sale per 15-20 minuti e frullala o schiacciala.","Porta a bollore il brodo di cottura, versa il semolino a pioggia e cuoci 3-4 minuti mescolando.","Unisci la zucca e la ricotta, poi l'olio a crudo."]],
[238,"Crema di mais e tapioca con merluzzo e carote","Pappa",[6,24],"30 min",["Crema mais e tapioca:20","Merluzzo:30","Carote:40","Olio EVO:5"],["Cuoci le carote a rondelle in acqua senza sale per 15 minuti.","Cuoci il merluzzo a vapore per 8-10 minuti e controlla con cura che non ci siano spine.","Stempera la crema nel brodo caldo, unisci carote e pesce frullati o sminuzzati e l'olio a crudo."]],
[239,"Pastina con piselli e tacchino","Pappa",[6,24],"30 min",["Pastina:20","Piselli:30","Petto di tacchino:25","Olio EVO:5"],["Cuoci i piselli in acqua senza sale per 15 minuti e passali per togliere le bucce.","Cuoci il tacchino a vapore o lessato e frullalo o sminuzzalo finemente.","Cuoci la pastina nel brodo, unisci piselli e tacchino e l'olio a crudo."]],
[240,"Pastina con crema di ceci e zucchine","Pappa",[6,24],"30 min",["Pastina:20","Ceci decorticati:15","Zucchine:40","Olio EVO:5"],["Cuoci i ceci decorticati con le zucchine in acqua senza sale per 20 minuti.","Frulla fino a ottenere una crema liscia.","Cuoci la pastina nella crema allungata con un po' di brodo e aggiungi l'olio a crudo."]],
[241,"Purè di patate e carote con pollo","Pappa",[6,24],"35 min",["Patate:50","Carote:30","Petto di pollo:25","Olio EVO:5"],["Lessa patate e carote a pezzi in acqua senza sale per 20 minuti.","Cuoci il pollo a vapore o lessato e frullalo o sminuzzalo finemente.","Schiaccia le verdure con un po' di brodo, unisci il pollo e l'olio a crudo."]],
[242,"Semolino con fagiolini e manzo","Pappa",[6,24],"35 min",["Semolino:20","Fagiolini:40","Manzo magro:25","Olio EVO:5"],["Cuoci i fagiolini in acqua senza sale per 15-20 minuti e frullali.","Cuoci il manzo a vapore o lessato e frullalo o sminuzzalo finemente.","Cuoci il semolino nel brodo 3-4 minuti, unisci fagiolini e manzo e l'olio a crudo."]],
[243,"Pappa di finocchi, patate e orata","Pappa",[6,24],"35 min",["Finocchi:40","Patate:40","Orata:30","Olio EVO:5"],["Cuoci finocchi e patate a pezzi in acqua senza sale per 20 minuti.","Cuoci l'orata a vapore per 8-10 minuti e controlla con cura che non ci siano spine.","Frulla o schiaccia tutto secondo l'età con un po' di brodo e aggiungi l'olio a crudo."]],
[244,"Crema di riso con spinaci e tuorlo","Pappa",[8,24],"25 min",["Crema di riso:20","Spinaci:40","Uovo:25","Olio EVO:5"],["Rassoda l'uovo per 9-10 minuti e usa il tuorlo ben cotto.","Cuoci gli spinaci in poca acqua senza sale per 5 minuti e frullali.","Stempera la crema di riso nel brodo caldo, unisci spinaci e tuorlo schiacciato e l'olio a crudo."]],
[245,"Orzo con broccoli e coniglio","Pappa",[8,24],"45 min",["Orzo perlato:20","Broccoli:40","Coniglio:25","Olio EVO:5"],["Cuoci l'orzo in acqua senza sale per il tempo indicato, finché è molto morbido.","Cuoci i broccoli a vapore per 8 minuti e il coniglio lessato, togliendo tutti gli ossicini.","Frulla o sminuzza secondo l'età, unisci all'orzo e aggiungi l'olio a crudo."]],
[246,"Quinoa con zucchine e sogliola","Pappa",[8,24],"30 min",["Quinoa:15","Zucchine:40","Sogliola:30","Olio EVO:5"],["Sciacqua la quinoa e cuocila in acqua senza sale per 15 minuti, finché è morbida.","Cuoci zucchine e sogliola a vapore e controlla con cura che non ci siano spine.","Frulla o schiaccia secondo l'età, unisci alla quinoa e aggiungi l'olio a crudo."]],
[247,"Pastina al pomodoro e ricotta","Pappa",[8,24],"20 min",["Pastina:20","Passata di pomodoro:30","Ricotta:25","Olio EVO:5"],["Cuoci la passata con un po' d'acqua per 10 minuti, senza sale.","Cuoci la pastina in acqua senza sale e scolala.","Condisci con il pomodoro, la ricotta e l'olio a crudo."]],
[248,"Polentina con salmone e zucchine","Pappa",[8,24],"30 min",["Farina di mais per polenta:20","Salmone:25","Zucchine:40","Olio EVO:4"],["Cuoci la farina di mais in acqua senza sale, mescolando, finché è morbida e cremosa.","Cuoci zucchine e salmone a vapore e controlla con cura che non ci siano spine.","Frulla o sminuzza secondo l'età, unisci alla polentina e aggiungi l'olio a crudo."]],
[249,"Riso stracotto con zucchine e ricotta","Pappa",[8,24],"30 min",["Riso:20","Zucchine:40","Ricotta:25","Olio EVO:5"],["Cuoci il riso in abbondante acqua senza sale con le zucchine a pezzetti, finché è molto morbido.","Schiaccia o frulla secondo l'età.","Unisci la ricotta e l'olio a crudo."]]

const spool=dt=>{const m=mCl(dt),k=K();return SND.filter(d=>m>=d.a[0]&&m<=d.a[1]&&okAv(k,d))};
const snKey=(k,w)=>'S'+iso(w)+'-';
function snkGen(c,w,force){c.snk=c.snk||{};const key=iso(w),pl=asKid(c.id,()=>spool(w));let a=c.snk[key];const ids=pl.map(x=>x.id),dn=a&&a.some((id,j)=>c.done[snKey(c,w)+j]);if(!a||(!dn&&(force||a.some(id=>!B[id]||!ids.includes(id))))){const n=Math.round(w/6048e5),off=force?Math.floor(Math.random()*Math.max(1,pl.length)):0;a=[];for(let j=0;j<3&&j<pl.length;j++)a.push(pl[(n*3+j+off)%pl.length].id);c.snk[key]=a;save()}return a}
const snk=()=>{const c=K();return c?snkGen(c,wk):[]};
const snDone=j=>{const v=S.done[snKey(null,wk)+j];return v===snk()[j]+1};
function snPrep(j,rv){const id=snk()[j],k=snKey(null,wk)+j,was=snDone(j);let dep=[];if(was){delete S.done[k];adj(id,1)}else{S.done[k]=id+1;dep=adj(id,-1)}save();bd();draw();if(rv)snRec(j);toast(was?'Preparazione annullata':dep.length?'Esaurito: '+dep.join(', ')+' → da comprare':'✓ Segnato come preparato')}
function snSwap(j){if(snDone(j)){toast('Annulla prima la preparazione');return}const a=snk(),pl=spool(wk).map(x=>x.id),alt=pl.filter(x=>!a.includes(x));if(!alt.length){toast('Nessuna alternativa disponibile');return}const c=K();c.snk[iso(wk)][j]=alt[Math.floor(Math.random()*alt.length)];save();bd();draw();snRec(j)}
function snRec(j){const id=snk()[j],dn=snDone(j),sh=document.getElementById('sh');sh.innerHTML=recHTML(B[id],R[id],'Colazione o spuntino',`<div class='nt'>${SNH}</div><button class='pb ${dn?'on':''}' onclick='snPrep(${j},1)'>${dn?'✓ Preparato · tocca per annullare':'Segna come preparato'}</button><div style='display:flex;gap:8px;margin-top:10px'><button class='btn' style='flex:1;height:46px' onclick='snSwap(${j})'>Cambia</button><button class='btn' style='flex:1;height:46px' onclick='cl()'>Chiudi</button></div>`);sh.scrollTop=0;document.getElementById('ov').classList.add('on')}
function snCard(){const a=snk();if(!a.length)return '';return `<div class="card" style="padding:12px 14px"><div class="row3"><b>Colazione e spuntino</b><span class="mu" style="font-size:12.5px">3 questa settimana</span></div><div class="sp">${a.map((id,j)=>`<button class="xp ${snDone(j)?'on':''}" onclick="snRec(${j})">${snDone(j)?CK:''}${B[id].n}</button>`).join('')}</div><div class="mu" style="margin-top:8px;font-size:13px">Merenda: aggiungi yogurt o frutta a piacere.</div></div>`}

function dEval(a,b,m){const t=TGT(m),s=[0,0,0,0];[a,b].forEach(id=>{const d=B[id];if(d)d.m0.forEach((x,k)=>s[k]+=x)});const E=4*s[0]+9*s[1]+4*s[2]||1,pc={C:400*s[0]/E,F:900*s[1]/E,P:400*s[2]/E},fi=s[3]*1000/E,bad=[];let c=0;
['C','F','P'].forEach(k=>{const[ce,to]=t[k],dv=pc[k]-ce,o=Math.max(0,Math.abs(dv)-to)/to;if(o>0){c+=(1+o)*(1+o);bad.push([k,dv>0?1:0])}});if(t.fi&&fi<t.fi){const o=(t.fi-fi)/t.fi;c+=(1+o)*(1+o)*.5;bad.push(['fi',0])}return{c,bad,pc}}
const BASEI={pasta:['Pasta','Pasta corta','Pastina',"Pasta all'uovo",'Lasagne','Pasta integrale','Pasta senza glutine','Tortellini','Ravioli ricotta e spinaci'],riso:['Riso','Crema di riso','Noodles di riso','Riso integrale','Riso basmati','Riso venere','Farina di riso','Gallette di riso'],cereali:['Semolino','Cous cous','Farro','Orzo perlato','Quinoa',"Fiocchi d'avena",'Crema mais e tapioca','Miglio','Grano saraceno','Bulgur','Amaranto','Muesli','Corn flakes'],patate:['Patate','Patata dolce','Gnocchi di patate'],pane:['Pane','Pane pita','Tortillas di grano','Pane integrale','Pane di segale','Focaccia','Impasto per pizza','Piadina','Grissini','Crackers','Pancarrè','Pane carasau'],polenta:['Farina di mais per polenta']};
function bOf(d){if(!d)return '';if(d.bi===d.i0)return d.b;let b='',v=0;d.i0.forEach(([n,q])=>{const u=NU[n];if(u)Object.keys(BASEI).forEach(k=>{if(BASEI[k].includes(n)&&u[0]*q>v){v=u[0]*q;b=k}})});d.bi=d.i0;return d.b=b}
const SKIPI=new Set(['Olio EVO','Parmigiano','Passata di pomodoro','Cipolla','Aglio','Basilico','Prezzemolo','Sale','Pepe']);
/* Quanti piatti di ogni gruppo e base ci sono davvero per questa età: gli obiettivi non forzano doppioni */
function wCtx(pl){const av={},bn={},bc={};pl.forEach(d=>{const g=gOf(d);av[g]=(av[g]||0)+1;const b=bOf(d);if(b)bn[b]=(bn[b]||0)+1});Object.keys(bn).forEach(b=>bc[b]=Math.max(b==='riso'?3:b==='polenta'?2:4,Math.ceil(14*bn[b]/pl.length)));return{av,bc}}
function wCost(p,m,x){x=x||wCtx(pool(wk));let c=0;const cnt={},gc={},bc={},pos={};let nI=0;
for(let d=0;d<7;d++){const a=B[p[2*d]],b=B[p[2*d+1]];c+=dEval(p[2*d],p[2*d+1],m).c;if(p[2*d]===p[2*d+1])c+=6;const g=gOf(a);if(g!=='Altro'&&g===gOf(b))c+=.5;const ba=bOf(a);if(ba&&ba===bOf(b))c+=.7;const ia=new Set(a.i0.map(y=>y[0]));b.i0.forEach(([n])=>{if(ia.has(n)&&!SKIPI.has(n))c+=.25})}
p.forEach((id,i)=>{const d=B[id];cnt[id]=(cnt[id]||0)+1;(pos[id]=pos[id]||[]).push(i>>1);const g=gOf(d);gc[g]=(gc[g]||0)+1;const bb=bOf(d);if(bb)bc[bb]=(bc[bb]||0)+1;if(d.int)nI++});
Object.keys(cnt).forEach(id=>{const n=cnt[id];if(n<2)return;c+=(n-1)*(n-1)*1.5;const ds=pos[id].sort((a,b)=>a-b);for(let k=1;k<ds.length;k++)if(ds[k]-ds[k-1]===1)c+=1});
{let need=0;Object.keys(GW).forEach(g=>{const n=gc[g]||0,lo=Math.min(GW[g][0],x.av[g]||0),hi=GW[g][1];need+=lo;if(n<lo)c+=(lo-n)*2.5;else if(n>hi)c+=(n-hi)*2+(hi-lo)*.9;else c+=(n-lo)*.9});const fr=Math.max(0,14-need),na=gc.Altro||0;if(na!==fr)c+=Math.abs(na-fr)*.9}
{const gd=[];for(let d=0;d<7;d++)gd.push(new Set([gOf(B[p[2*d]]),gOf(B[p[2*d+1]])].filter(g=>g!=='Altro')));for(let d=1;d<7;d++)gd[d].forEach(g=>{if(gd[d-1].has(g))c+=1.5})}
Object.keys(bc).forEach(b=>{const cap=x.bc[b]||4;if(bc[b]>cap)c+=(bc[b]-cap)*1.2});if(nI>2)c+=(nI-2)*3;return c}
/* Ricerca locale: cambia solo gli slot liberi; chg = costo di ogni pasto cambiato (evita modifiche inutili) */
function balance(p,free,m,chg){const P=pool(wk),pl=P.map(d=>d.id),x=wCtx(P),o=p.slice(),pen=()=>chg?free.reduce((a,i)=>a+(p[i]!==o[i]?chg:0),0):0,cost=()=>wCost(p,m,x)+pen();if(!pl.length||!free.length)return[];let best=cost(),it=0,go=true;
while(go&&it++<8){go=false;for(const i of free){const old=p[i];let bi=old;for(const id of pl){if(id===old)continue;p[i]=id;const c=cost();if(c<best-1e-9){best=c;bi=id}}p[i]=bi;if(bi!==old)go=true}
for(let a=0;a<free.length;a++)for(let b=a+1;b<free.length;b++){const i=free[a],j=free[b];if(p[i]===p[j])continue;[p[i],p[j]]=[p[j],p[i]];const c=cost();if(c<best-1e-9){best=c;go=true}else[p[i],p[j]]=[p[j],p[i]]}}return free.filter(i=>p[i]!==o[i])}
const isFix=(p,i)=>{const k=K();return (p[i]>=100&&!rotOk(B[p[i]],mCl(wk)))||!!(k&&k.fix&&k.fix[mk(i)]===p[i]+1)};
function setFix(i){const k=K();if(!k)return;k.fix=k.fix||{};k.fix[mk(i)]=plan()[i]+1}
function freeSl(p){const t=iso(new Date());return [...Array(14).keys()].filter(i=>!S.done[mk(i)]&&!isFix(p,i)&&mk(i).slice(0,10)>=t)}
/* Dopo una scelta dell'utente: prima l'altro pasto dello stesso giorno, poi il resto della settimana */
function rebal(sl){const p=plan(),m=mCl(wk),fr=freeSl(p),o=p.slice(),d1=[...new Set(sl.map(i=>i^1))].filter(j=>fr.includes(j));balance(p,d1,m,.3);balance(p,fr,m,.3);const ch=fr.filter(i=>p[i]!==o[i]);return{ch,o,w:iso(wk),k:S.cur}}
/* Quando cambiano le regole del menu, ricalibra una volta solo le settimane future già create (solo i pasti liberi); la settimana in corso resta com'è finché l'utente non la rigenera o sceglie un piatto */

function upgradePlans(){const t=iso(mon(new Date())),w0=wk,cu=S.cur;let n=0;try{S.kids.forEach(k=>{if(k.pv===PV)return;S.cur=k.id;Object.keys(k.plans).forEach(key=>{if(key<=t)return;wk=mon(new Date(key+'T12:00:00'));const p=k.plans[key];if(Array.isArray(p)&&p.length===14)n+=balance(p,freeSl(p),mCl(wk),.15).length});k.pv=PV})}finally{S.cur=cu;wk=w0}if(n){save();toast(`Le prossime settimane seguono lo schema delle proteine: ${n} ${n>1?'pasti aggiornati':'pasto aggiornato'}`)}}
let undoR=null;
function toastR(msg,r){if(!r||!r.ch.length){toast(msg);return}undoR=r;const t=document.getElementById('toast');t.innerHTML=`${E(msg)} · ricalibrati per l'equilibrio: ${r.ch.map(i=>DN[i>>1]+' '+(i%2?'cena':'pranzo')).join(', ')} <button class='lnk' style='color:#fff;text-decoration:underline;padding:0 0 0 6px' onclick='undoRb()'>Annulla</button>`;t.style.pointerEvents='auto';t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>{t.classList.remove('on');t.style.pointerEvents=''},6000)}

function eqLine(p,sd){const e=dEval(p[2*sd],p[2*sd+1],mCl(wk)),L={C:['Pochi carboidrati','Troppi carboidrati'],F:['Pochi grassi','Troppi grassi'],P:['Poche proteine','Troppe proteine'],fi:['Poche fibre']},ok=!e.bad.length;return `<div class='mu' style='margin:2px 6px 10px;font-size:12.5px'><i class='dt' style='background:${ok?'#6fb47c':'var(--wa)'};margin-right:6px'></i>${ok?'Giorno in equilibrio':e.bad.map(([k,s])=>L[k][s]).join(' · ')} · carboidrati ${Math.round(e.pc.C)}%, grassi ${Math.round(e.pc.F)}%, proteine ${Math.round(e.pc.P)}%</div>`}
