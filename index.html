<p class="note">Valori nutrizionali indicativi per porzione tipica a 8 mesi. Senza sale, miele, latte vaccino come bevanda né frutta secca intera. Continua l'allattamento/formula e confrontati con il pediatra per quantità e introduzione di nuovi alimenti (allergeni compresi).</p></div><div id='cv' style='display:none'></div><div id='bv' style='display:none'></div><div id='kv' style='display:none'></div><nav class='nav'><button id='n1' class='nb on' onclick="nav('piano')"><svg viewBox="0 0 24 24"><path d="M5 4v7a3 3 0 0 0 3 3v6M8 4v6M11 4v7a3 3 0 0 1-3 3"/><path d="M17 4c-2 1-3 3-3 6s1 4 3 4v6"/></svg>Piano</button><button id='n2' class='nb' onclick="nav('spesa')"><svg viewBox="0 0 24 24"><path d="M4 5h2l2 10h9l2-7H7"/><circle cx="10" cy="19" r="1.2"/><circle cx="17" cy="19" r="1.2"/></svg>Spesa<b id='bg' class='bgx'></b></button><button id='n3' class='nb' onclick="nav('cal')"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Calendario</button><button id='n4' class='nb' onclick="nav('bimbo')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M9 14c1 1.5 5 1.5 6 0M9.5 10h.01M14.5 10h.01"/></svg>Bambini</button><button id='n5' class='nb' onclick="nav('bug')"><svg viewBox="0 0 24 24"><path d="M6 21V4M6 5h11l-2 4 2 4H6"/></svg>Segnala</button></nav>

<script>
const D=[
{id:0,n:"Pastina, lenticchie rosse e zucca",t:"Legumi",m:[24,7,8,3],i:[["Pastina",20],["Lenticchie rosse decorticate",15],["Zucca",40],["Olio EVO",5],["Parmigiano",5]]},
{id:1,n:"Crema di riso, zucchine e pollo",t:"Carne bianca",m:[17,8,10,1],i:[["Crema di riso",20],["Zucchine",50],["Petto di pollo",30],["Olio EVO",5],["Parmigiano",5]]},
{id:2,n:"Semolino, carote e manzo",t:"Carne rossa",m:[18,8,9,2],i:[["Semolino",20],["Carote",50],["Manzo magro",30],["Olio EVO",5]]},
{id:3,n:"Pastina, patate e merluzzo",t:"Pesce",m:[24,6,9,2],i:[["Pastina",20],["Patate",40],["Merluzzo",40],["Olio EVO",5]]},
{id:4,n:"Crema mais e tapioca, tacchino e broccoli",t:"Carne bianca",m:[17,7,10,2],i:[["Crema mais e tapioca",20],["Petto di tacchino",30],["Broccoli",40],["Olio EVO",5]]},
{id:5,n:"Riso, piselli e tuorlo sodo",t:"Uovo",m:[18,9,8,3],i:[["Riso",20],["Piselli",40],["Uovo",25],["Olio EVO",5]]},
{id:6,n:"Pastina, ricotta e spinaci",t:"Latticini",m:[17,10,8,2],i:[["Pastina",20],["Ricotta",30],["Spinaci",40],["Olio EVO",5]]},
{id:7,n:"Crema di ceci, carote e riso",t:"Legumi",m:[20,7,7,4],i:[["Ceci decorticati",30],["Carote",40],["Crema di riso",15],["Olio EVO",5]]},
{id:8,n:"Orata, patate e zucchine",t:"Pesce",m:[11,8,9,2],i:[["Orata",40],["Patate",50],["Zucchine",40],["Olio EVO",5]]},
{id:9,n:"Salmone, zucca e crema di riso",t:"Pesce",m:[17,9,8,2],i:[["Salmone",35],["Zucca",50],["Crema di riso",20],["Olio EVO",3]]},
{id:10,n:"Semolino, coniglio e zucchine",t:"Carne bianca",m:[17,8,10,1],i:[["Semolino",20],["Coniglio",30],["Zucchine",50],["Olio EVO",5]]},
{id:11,n:"Quinoa, cavolfiore e ricotta",t:"Latticini",m:[17,10,9,2],i:[["Quinoa",20],["Cavolfiore",50],["Ricotta",30],["Olio EVO",5]]},
{id:12,n:"Riso, patata dolce e manzo",t:"Carne rossa",m:[25,8,9,3],i:[["Riso",20],["Patata dolce",50],["Manzo magro",30],["Olio EVO",5]]},
{id:13,n:"Pastina, fagiolini e sogliola",t:"Pesce",m:[17,6,10,2],i:[["Pastina",20],["Sogliola",40],["Fagiolini",40],["Olio EVO",5]]}];
const B={};D.forEach(d=>B[d.id]=d);
let NOTE=`Consistenza: crema o schiacciata con la forchetta, con qualche pezzetto molto morbido. Niente sale. Controlla sempre la temperatura prima di servire.`;
const R={
0:{t:`25 min`,s:[`Cuoci la zucca a cubetti e le lenticchie rosse in acqua (o brodo vegetale senza sale) per 15 minuti.`,`Aggiungi la pastina e cuoci per il tempo indicato sulla confezione.`,`Schiaccia o frulla in parte, lasciando pezzettini morbidi.`,`Fuori dal fuoco unisci l'olio EVO e il parmigiano.`]},
1:{t:`20 min`,s:[`Lessa le zucchine e il pollo a pezzetti in poca acqua per 10-12 minuti.`,`Frulla con un po' di acqua di cottura fino a ottenere una crema.`,`Porta a bollore e incorpora la crema di riso mescolando per 2-3 minuti.`,`Unisci l'olio EVO e il parmigiano.`]},
2:{t:`30 min`,s:[`Lessa le carote e il manzo magro per circa 20 minuti.`,`Frulla con un mestolo di acqua di cottura.`,`Rimetti sul fuoco, versa il semolino a pioggia e cuoci 3-4 minuti mescolando.`,`Aggiungi l'olio EVO a crudo.`]},
3:{t:`25 min`,s:[`Cuoci le patate a cubetti per 10 minuti.`,`Aggiungi il merluzzo e la pastina e cuoci per altri 6-8 minuti.`,`Controlla con cura che non ci siano lische e schiaccia con la forchetta.`,`Aggiungi l'olio EVO a crudo.`]},
4:{t:`20 min`,s:[`Lessa le cimette di broccolo e il tacchino a pezzetti per 10-12 minuti.`,`Frulla con acqua di cottura.`,`Riporta sul fuoco, aggiungi la crema di mais e tapioca e cuoci 2-3 minuti.`,`Unisci l'olio EVO.`]},
5:{t:`30 min`,s:[`Cuoci l'uovo sodo per 10 minuti, sguscialo e schiaccialo con la forchetta.`,`Cuoci riso e piselli per 15-18 minuti, fino a quando sono molto morbidi.`,`Schiaccia o frulla in parte e unisci l'uovo.`,`Aggiungi l'olio EVO a crudo.`]},
6:{t:`15 min`,s:[`Lessa gli spinaci per 4-5 minuti, scola bene e trita finemente.`,`Cuoci la pastina in acqua o brodo vegetale senza sale.`,`Mescola pastina, spinaci e ricotta.`,`Aggiungi l'olio EVO a crudo.`]},
7:{t:`35 min`,s:[`Cuoci le carote per 15 minuti. Usa ceci decorticati già cotti (se in barattolo, sciacquali molto bene).`,`Frulla ceci e carote con un po' di acqua di cottura.`,`Aggiungi la crema di riso e cuoci 2-3 minuti mescolando.`,`Unisci l'olio EVO.`]},

const r2=n=>{const mc=left[n]>st(n)?`<span style='color:var(--wa)'> · mancano ${r(left[n]-st(n))} g</span>`:'';return `<div class='ing'><div class='t'><div class='nm2'>${n}</div><div class='meta'>In dispensa <b>${r(st(n))} g</b> · da usare ${r(left[n]||0)} g${mc}</div></div><button class='lnk' data-n='${n}' onclick='fin(this.dataset.n)'>Finito</button></div>`};
document.getElementById('app').innerHTML=sw3()+`<div class='sech'><h2>Da comprare</h2><span class='cnt'>${buyL.length}</span></div><div class='card lst'>${buyL.map(r1).join('')||`<div class='mu' style='padding:14px 0'>Hai tutto in dispensa.</div>`}</div><div class='sech'><h2>Dispensa</h2><span class='cnt'>${pan.length}</span></div><div class='card lst'>${pan.map(r2).join('')||`<div class='mu' style='padding:14px 0'>La dispensa è vuota.</div>`}</div>`;bd()}
function buyFam2(n){const key=iso(wk);S.kids.forEach(k=>{const kn=kidNeeds(k),nd=kn.need[n]||0;const stk=Math.max(0,k.stock[n]||0),sh=Math.max(0,(kn.left[n]||0)-stk);if(nd>0&&(stk<=0||sh>0)){const q=sh>0?sh:nd;k.bought[key]=k.bought[key]||{};k.bought[key][n]=(k.bought[key][n]||0)+q;k.stock[n]=(k.stock[n]||0)+q}});save();bd();drawSpesa()}
function finFam(n){S.kids.forEach(k=>{if(k.stock[n]>0)k.stock[n]=0});save();bd();drawSpesa()}
function drawFam(){document.getElementById('wl').textContent=dl(0)+' – '+dl(6);
const ds=S.kids.map(k=>({k,...kidNeeds(k)})),need={},srt=(x,y)=>x.localeCompare(y,'it');ds.forEach(d=>{for(const n in d.need)need[n]=(need[n]||0)+d.need[n]});
const qk=(d,n)=>{const s=Math.max(0,(d.left[n]||0)-Math.max(0,d.k.stock[n]||0));return s||d.need[n]||0},lack=n=>ds.filter(d=>d.need[n]&&(!(d.k.stock[n]>0)||(d.left[n]||0)>d.k.stock[n])),buyL=Object.keys(need).filter(n=>lack(n).length).sort(srt),pan=[...new Set(ds.flatMap(d=>Object.keys(d.k.stock).filter(n=>d.k.stock[n]>0)))].sort(srt);
const r1=n=>{const ls=lack(n);return `<div class='ing'><div class='t'><div class='nm2'>${n}${ls.some(d=>d.k.stock[n]!==undefined)?`<span class='tag'>Esaurito</span>`:''}</div><div class='meta'>Per ${ls.map(d=>E(d.k.name)+' <b>'+qk(d,n)+' g</b>').join(' · ')}</div></div><button class='ck sm' data-n='${n}' aria-label='Segna come acquistato' onclick='buyFam2(this.dataset.n)'>${CK}</button></div>`};
const r2=n=>{const hs=ds.filter(d=>d.k.stock[n]>0);return `<div class='ing'><div class='t'><div class='nm2'>${n}</div><div class='meta'>In dispensa <b>${hs.reduce((a,d)=>a+d.k.stock[n],0)} g</b> (${hs.map(d=>E(d.k.name)+' '+d.k.stock[n]+' g').join(' · ')})</div></div><button class='lnk' data-n='${n}' onclick='finFam(this.dataset.n)'>Finito</button></div>`};
document.getElementById('app').innerHTML=sw3()+(ds.length?`<div class='sech'><h2>Da comprare</h2><span class='cnt'>${buyL.length}</span></div><div class='card lst'>${buyL.map(r1).join('')||`<div class='mu' style='padding:14px 0'>Hai tutto in dispensa.</div>`}</div><div class='sech'><h2>Dispensa della famiglia</h2><span class='cnt'>${pan.length}</span></div><div class='card lst'>${pan.map(r2).join('')||`<div class='mu' style='padding:14px 0'>La dispensa è vuota.</div>`}</div>`:`<div class='card'><div class='mu'>Aggiungi almeno un bambino nella sezione Bambini.</div></div>`);bd()}
function drawCal(){const v=document.getElementById('cv'),y=cm.getFullYear(),mo=cm.getMonth(),off=(new Date(y,mo,1,12).getDay()+6)%7,n=new Date(y,mo+1,0).getDate(),td=iso(new Date());
let h=sw4()+`<h1>Calendario</h1><div class='wk'><button class='btn' aria-label='Mese precedente' onclick='cmv(-1)'>‹</button><b>${MF[mo]} ${y}</b><button class='btn' aria-label='Mese successivo' onclick='cmv(1)'>›</button></div><div class='cal'>`+DN.map(x=>`<div class='cd mu'>${x}</div>`).join('');
for(let i=0;i<off;i++)h+=`<div></div>`;
for(let d=1;d<=n;d++){const dt=new Date(y,mo,d,12),k=iso(dt),dn=fam?cf(k):[0,1].filter(s=>S.done[k+'-'+s]).length;h+=`<button class='cc c${dn} ${k===cs?'sel':''} ${k===td?'td':''}' data-k='${k}' onclick='cpick(this.dataset.k)'>${d}</button>`}
h+=`</div><div class='mu' style='margin:10px 2px 0'>${fam?`<i class='sq' style='background:#fff;border:1px solid var(--bd)'></i>nessuna pappa · <i class='sq' style='background:#fde68a'></i>alcune · <i class='sq' style='background:#b7e0bf'></i>tutte preparate`:`<i class='sq' style='background:#fff;border:1px solid var(--bd)'></i>nessuna pappa · <i class='sq' style='background:#fde68a'></i>una su due · <i class='sq' style='background:#b7e0bf'></i>entrambe preparate`}</div>`;
if(fam){v.innerHTML=h+famDay();return}
const sd=new Date(cs+'T12:00:00'),p=pf(sd),ix=(sd.getDay()+6)%7,tit=`${DF[ix]} ${sd.getDate()} ${MN[sd.getMonth()]}`,nd=[0,1].filter(s=>S.done[cs+'-'+s]).length;
h+=`<div class='sech'><h2>${tit}</h2>${p?`<span class='cnt'>${nd}/2</span>`:''}</div>`;
if(!p)h+=`<div class='card'><div class='mu'>Nessun menu salvato per questo giorno. Apri il Piano e vai a quella settimana per crearlo.</div></div>`;
else{for(let s=0;s<2;s++){const dn=S.done[cs+'-'+s],id=typeof dn==='number'?dn-1:p[ix*2+s],lb=DN[ix]+' '+sd.getDate()+' '+MN[sd.getMonth()]+' · '+(s?'Cena':'Pranzo');h+=`<div class='card mc'><div class='mb' data-i='${id}' data-l='${lb}' onclick='recView(+this.dataset.i,this.dataset.l)'><div class='lab'><i class='dt' style='background:${s?'#E8938A':'#F7C65A'}'></i>${s?'Cena':'Pranzo'}${dn?' · preparata':''}</div><div class='nm'>${B[id].n}</div><div class='meta'>${R[id].t} · ${B[id].t}</div></div><button class='ck ${dn?'on':''}' aria-label='Segna come preparata' data-k='${cs}-${s}' data-i='${id}' onclick='cdone(this.dataset.k,+this.dataset.i)'>${CK}</button></div>`}
h+=`<button class='btn' style='width:100%;margin-top:6px' onclick='go(cs)'>Apri questa settimana nel Piano</button>`}
v.innerHTML=h}
applyAge();regenAuto();fixWeeks();bd();if(!S.child)nav('bimbo');else draw();cloudInit();
</script></body></html>
